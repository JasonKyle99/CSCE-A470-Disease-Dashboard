<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Disease Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="dist/leaflet.css">
	<link rel="stylesheet" href="style.css">
    <style>
        #map {
            height: 600px;
            width: 100%;
			
        }

        #controls {
            padding: 10px;
            background: white;
            font-family: Arial, sans-serif;
        }

        #yearSlider {
            margin-left: 10px;
            width: 250px;
            vertical-align: middle;
        }

        #yearValue {
            margin-left: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Controls -->
	
<!-- Map Title -->

	<div id="mapTitle">
		<h1>Disease Map</h1>
	</div>
    <div id="controls">

        <label for="yearSlider">
            <strong>Year:</strong>
            <span id="yearValue">2016</span>
        </label>

        <input
            type="range"
            id="yearSlider"
            min="2000"
            max="2016"
            step="1"
            value="2016"
        >
    </div>

	<!-- Map Layout -->

	<div id="mapLayout">

		<!-- Left Box -->
		<div id="leftBox">
		</div>


		<!-- Map -->
		<div id="map">
		</div>


		<!-- Right Box -->
		<div id="rightBox">
		</div>

	</div>





    <!-- Map -->
    <div id="map"></div>


    <!-- Leaflet JavaScript -->
    <script src="dist/leaflet.js"></script>

    <!-- Country location GeoJSON -->
    <script src="locations.js"></script>

    <!-- Disease data -->
    <script src="diseaseData.js"></script>


    <script>

        // ==========================================
        // SELECTED YEAR
        // ==========================================

        var selectedYear = 2016;


        // ==========================================
        // CREATE MAP
        // ==========================================

        var map = L.map('map').setView([37.8, -96], 2);


        // OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors',
            referrerPolicy: 'strict-origin-when-cross-origin'
        }).addTo(map);


        // ==========================================
        // COLOR SCALE
        // ==========================================

        function getColor(d) {

            return d > 20 ? '#800026' :
                   d > 10 ? '#BD0026' :
                   d > 5  ? '#E31A1C' :
                   d > 4  ? '#FC4E2A' :
                   d > 3  ? '#FD8D3C' :
                   d > 2  ? '#FEB24C' :
                   d > 1  ? '#FED976' :
                            '#FFEDA0';
        }


        // ==========================================
        // STYLE COUNTRIES
        // ==========================================

        function style(feature) {

            // Get country code from locations.js
            var countryCode = feature.properties.id;

            // Find country in diseaseData.js
            var country = diseaseData[countryCode];


            // No disease data for this country
            if (!country) {

                return {
                    fillColor: '#CCCCCC',
                    weight: 2,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.7
                };
            }


            // Get data for selected year
            var yearData = country.data[selectedYear];


            // No data for this year
            if (!yearData) {

                return {
                    fillColor: '#CCCCCC',
                    weight: 2,
                    opacity: 1,
                    color: 'white',
                    dashArray: '3',
                    fillOpacity: 0.7
                };
            }


            // Get density for selected year
            var density = yearData.density;


            // Return styling
            return {
                fillColor: getColor(density),
                weight: 2,
                opacity: 1,
                color: 'white',
                dashArray: '3',
                fillOpacity: 0.7
            };
        }


        // ==========================================
        // HIGHLIGHT COUNTRY
        // ==========================================

        function highlightFeature(e) {

            var layer = e.target;

            layer.setStyle({
                weight: 3,
                color: '#666',
                dashArray: '',
                fillOpacity: 0.7
            });

            layer.bringToFront();
        }


        // ==========================================
        // RESET COUNTRY
        // ==========================================

        function resetHighlight(e) {

            geojson.resetStyle(e.target);
        }


        // ==========================================
        // COUNTRY POPUP
        // ==========================================

        function createPopup(feature, layer) {

            // Get country code
            var countryCode = feature.properties.id;

            // Get country
            var country = diseaseData[countryCode];


            // If country isn't in diseaseData
            if (!country) {
                return;
            }


            // Get selected year's data
            var yearData = country.data[selectedYear];


            // If selected year doesn't exist
            if (!yearData) {
                return;
            }


            // Create popup
            layer.bindPopup(
                '<strong>' + country.name + '</strong><br>' +
                'Year: ' + selectedYear + '<br>' +
                'Genotyped cases: ' + yearData.genotypedCases + '<br>' +
                'Bovis cases: ' + yearData.bovisCases + '<br>' +
                'Bovis percent: ' + yearData.bovisPercent + '%<br>' +
                'US born: ' + yearData.usBorn + '<br>' +
                'Non-US born: ' + yearData.nonUsBorn + '<br>' +
                'Density: ' + yearData.density
            );
        }


        // ==========================================
        // COUNTRY FEATURES
        // ==========================================

        function onEachFeature(feature, layer) {

            // Mouse events
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight
            });


            // Create popup
            createPopup(feature, layer);
        }


        // ==========================================
        // CREATE GEOJSON LAYER
        // ==========================================

        var geojson = L.geoJson(locationData, {

            style: style,

            onEachFeature: onEachFeature

        }).addTo(map);


        // ==========================================
        // YEAR SLIDER
        // ==========================================

        var yearSlider = document.getElementById('yearSlider');

        var yearValue = document.getElementById('yearValue');


        yearSlider.addEventListener('input', function() {

            // Get year from slider
            selectedYear = Number(this.value);


            // Update displayed year
            yearValue.textContent = selectedYear;


            // Re-style all countries
            geojson.setStyle(style);


            // Update popups
            geojson.eachLayer(function(layer) {

                var feature = layer.feature;

                var countryCode = feature.properties.id;

                var country = diseaseData[countryCode];


                // No disease data
                if (!country) {
                    return;
                }


                // Get data for selected year
                var yearData = country.data[selectedYear];


                // No data for this year
                if (!yearData) {
                    return;
                }


                // Update popup
                layer.bindPopup(
                    '<strong>' + country.name + '</strong><br>' +
                    'Year: ' + selectedYear + '<br>' +
                    'Genotyped cases: ' + yearData.genotypedCases + '<br>' +
                    'Bovis cases: ' + yearData.bovisCases + '<br>' +
                    'Bovis percent: ' + yearData.bovisPercent + '%<br>' +
                    'US born: ' + yearData.usBorn + '<br>' +
                    'Non-US born: ' + yearData.nonUsBorn + '<br>' +
                    'Density: ' + yearData.density
                );

            });

        });

    </script>

</body>
</html>
